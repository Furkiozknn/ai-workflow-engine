name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # pyproject.toml soz veriyor: 3.11, 3.12, 3.13. Tek bir surumde kosan CI
    # digerleri icin hicbir sey kanitlamiyor -- tomllib/typing farki gibi bir
    # kirilma ancak kullanicida gorunurdu.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # --locked: uv.lock pyproject.toml'la uyusmuyorsa burada kirmizi yanar,
      # sessizce yeniden cozulmez.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest -v

  # Yayin is akisi paketi yalniz etiket itildiginde kuruyor; paketlemeyi
  # bozan bir degisiklik ancak yayin gunu fark edilirdi. twine>=7: hatchling
  # 1.32 Metadata-Version 2.5 uretiyor ve twine 6.x bunu "gecersiz" diye
  # reddediyor (yerelde olculdu), yani eski bir twine burada yanlis kirmizi verir.
  paket:
    name: paketle ve twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx --from 'twine>=7' twine check --strict dist/*

  # Bu motorun testlerinin tamami, ai-job-gateway'in ne dondugune dair BIZIM
  # inancimizi kodlayan elle yazilmis bir sahteye karsi kosuyor. O sahte tek
  # bir okumayi donduruyor ve gateway degistiginde kimse ona haber vermiyor:
  # yeniden adlandirilmis bir alan, yeni bir durum degeri, farkli bir zarf --
  # testler yesil kalir, ikili calismayi birakir.
  #
  # Bu is GERCEK gateway'i kuruyor ve ayni testleri ona karsi kosuyor.
  # Sunucu yok, port yok, konteyner yok: gateway'in create_app'i httpx'in
  # ASGITransport'una baglaniyor, her sey tek surecte.
  sozlesme:
    name: gercek ai-job-gateway ile sozlesme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      # Ana daldan: sozlesmenin BUGUN ne oldugunu olcmek istiyoruz, yayinlanmis
      # bir surumun ne oldugunu degil. Bir kirilma burada, tuketen tarafta
      # gorunmeli -- tek aci verdigi yer orasi.
      - name: Gercek ai-job-gateway'i kur
        run: |
          uv sync --group dev
          uv pip install "git+https://github.com/Furkiozknn/ai-job-gateway@main"

      # Tek kosu, iki kontrol. Test dosyasi gateway kurulu degilse kendini
      # atliyor -- bu, elindeki gateway olmayan bir katkiciyi engellememek
      # icin dogru davranis, ama BURADA olmasi isin hicbir sey olcmedigi
      # anlamina gelir. O yuzden hem cikis kodu hem de "skipped" araniyor.
      - name: Sozlesme testleri
        run: |
          set -euo pipefail
          uv run pytest tests/test_gercek_gateway.py -v 2>&1 | tee /tmp/sozlesme.txt
          if grep -qE '[0-9]+ skipped' /tmp/sozlesme.txt; then
            echo "sozlesme testleri atlandi: gateway kurulmamis, bu is bir sey olcmedi"
            exit 1
          fi
          echo "sozlesme testleri gercekten kostu"

  vendor:
    name: gateway_poll.py kaynagiyla ayni mi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bu dosya ai-job-gateway'den kopyalandi. Kopyalamak bilincli bir karar:
      # dort projeden hicbiri digerine bagimli olmak zorunda kalmiyor. Ama
      # kopyalar sessizce ayrisir -- birinde duzeltilen bir sinir durumu
      # digerlerinde durmaya devam eder ve her depo kendi kopyasina karsi
      # yesil kalir. Betik ag yoksa ATLIYOR, gecmiyor (cikis 2).
      - name: Kanonik kopyayla karsilastir
        run: |
          set -eu
          kod=0
          python3 arac/vendor-dogrula.py || kod=$?
          case "$kod" in
            0) echo "ayni" ;;
            2) echo "::warning::kanonik kopyaya bakilamadi; bu adim bir sey kanitlamadi" ;;
            *) exit "$kod" ;;
          esac
