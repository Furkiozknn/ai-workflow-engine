name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -v

  # Bu motorun testlerinin tamami, ai-job-gateway'in ne dondugune dair BIZIM
  # inancimizi kodlayan elle yazilmis bir sahteye karsi kosuyor. O sahte tek
  # bir okumayi donduruyor ve gateway degistiginde kimse ona haber vermiyor:
  # yeniden adlandirilmis bir alan, yeni bir durum degeri, farkli bir zarf --
  # testler yesil kalir, ikili calismayi birakir.
  #
  # Bu is GERCEK gateway'i kuruyor ve ayni testleri ona karsi kosuyor.
  # Sunucu yok, port yok, konteyner yok: gateway'in create_app'i httpx'in
  # ASGITransport'una baglaniyor, her sey tek surecte.
  sozlesme:
    name: gercek ai-job-gateway ile sozlesme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      # Ana daldan: sozlesmenin BUGUN ne oldugunu olcmek istiyoruz, yayinlanmis
      # bir surumun ne oldugunu degil. Bir kirilma burada, tuketen tarafta
      # gorunmeli -- tek aci verdigi yer orasi.
      - name: Gercek ai-job-gateway'i kur
        run: |
          uv sync --group dev
          uv pip install "git+https://github.com/Furkiozknn/ai-job-gateway@main"

      - name: Sozlesme testleri
        run: uv run pytest tests/test_gercek_gateway.py -v

      # Test dosyasi gateway yoksa kendini atliyor; o atlamanin BURADA
      # gerceklesmesi, isin hicbir sey olcmedigi anlamina gelir.
      - name: Atlanmadigini dogrula
        run: |
          set -eu
          uv run pytest tests/test_gercek_gateway.py -q 2>&1 | tee /tmp/out.txt
          if grep -qE '[0-9]+ skipped' /tmp/out.txt; then
            echo "sozlesme testleri atlandi: gateway kurulmamis, bu is bir sey olcmedi"
            exit 1
          fi
          echo "sozlesme testleri gercekten kostu
