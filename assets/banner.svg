<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ai-workflow-engine - a pipeline is a plain YAML file that runs as a DAG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1d28"/>
      <stop offset="100%" stop-color="#0b2028"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d3bb"/>
      <stop offset="50%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#56d4b4"/>
    </linearGradient>
    <linearGradient id="markAccent" gradientUnits="userSpaceOnUse" x1="72" y1="108" x2="146" y2="190">
      <stop offset="0%" stop-color="#39d3bb"/>
      <stop offset="60%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#56d4b4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39d3bb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#39d3bb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <g>
    <g stroke="#39d3bb" stroke-opacity="0.55" stroke-width="2" fill="none">
      <path d="M878 104 L976 152"/><path d="M878 208 L976 160"/>
      <path d="M1032 156 L1104 156"/>
    </g>
    <g fill="#122a2a" stroke="#39d3bb" stroke-width="2">
      <rect x="812" y="80" width="66" height="48" rx="10"/>
      <rect x="812" y="184" width="66" height="48" rx="10"/>
      <rect x="976" y="132" width="56" height="48" rx="10"/>
      <rect x="1104" y="132" width="56" height="48" rx="10"/>
    </g>
    <g fill="#39d3bb" opacity="0.9">
      <rect x="826" y="96" width="38" height="5" rx="2.5"/><rect x="826" y="108" width="26" height="5" rx="2.5"/>
      <rect x="826" y="200" width="38" height="5" rx="2.5"/><rect x="826" y="212" width="26" height="5" rx="2.5"/>
      <rect x="990" y="148" width="28" height="5" rx="2.5"/><rect x="990" y="160" width="20" height="5" rx="2.5"/>
      <rect x="1118" y="148" width="28" height="5" rx="2.5"/><rect x="1118" y="160" width="20" height="5" rx="2.5"/>
    </g>
    <text x="845" y="66" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#4c8dff">layer 0 &#8212; concurrent</text>
  </g>

  <g transform="translate(72,108)" fill="none" stroke="url(#markAccent)" stroke-width="7" stroke-linecap="round">
    <circle cx="14" cy="20" r="10"/>
    <circle cx="14" cy="62" r="10"/>
    <circle cx="70" cy="41" r="10"/>
    <path d="M26 26 L58 37"/>
    <path d="M26 56 L58 46"/>
  </g>

  <text x="176" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#e6edf3">ai-workflow-engine</text>
  <text x="178" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b98a9">A pipeline is a plain YAML file in git, not a visual editor.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">
    <g transform="translate(178,204)">
      <rect width="181" height="34" rx="17" fill="#0f2a24" stroke="#1f6f5c"/>
      <text x="90" y="22" text-anchor="middle" fill="#56d4b4">validated before it runs</text>
    </g>
    <g transform="translate(370,204)">
      <rect width="229" height="34" rx="17" fill="#0f2130" stroke="#1f4f7a"/>
      <text x="114" y="22" text-anchor="middle" fill="#6cb6ff">independent steps concurrent</text>
    </g>
    <g transform="translate(610,204)">
      <rect width="175" height="34" rx="17" fill="#1c1730" stroke="#4a3b7a"/>
      <text x="87" y="22" text-anchor="middle" fill="#b394f7">sandboxed templating</text>
    </g>
  </g>

  <text x="178" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5c6b7f">59 tests &#183; cycles + undeclared deps rejected at load &#183; e2e against a live gateway &#183; MIT</text>
</svg>
