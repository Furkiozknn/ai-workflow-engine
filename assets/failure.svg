<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" width="1200" height="348" role="img" aria-label="Failure semantics: layer 0 succeeds and its results are kept, a step in layer 1 raises and the run stops there with PipelineRunError carrying the failing step and every result collected so far, and layer 2 never starts - no skipped status is invented for it.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1f24"/>
      <stop offset="100%" stop-color="#0b1a20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d3bb"/>
      <stop offset="50%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b98a9"/>
    </marker>
  </defs>
  <rect width="1200" height="348" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#e6edf3">when a step fails</text>
  <text x="40" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b98a9">the run stops at the layer that broke - and everything already earned is handed back, not discarded</text>
    <rect x="40" y="130" width="200" height="62" rx="12" fill="#131a26" stroke="#3fb950" stroke-width="1.6"/>
    <text x="140" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3fb950">layer 0</text>
    <text x="140" y="177" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">2 steps, both ok</text>
    <rect x="300" y="130" width="200" height="62" rx="12" fill="#131a26" stroke="#f2777a" stroke-width="1.6"/>
    <text x="400" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f2777a">layer 1</text>
    <text x="400" y="177" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">1 of 2 raised</text>
    <rect x="560" y="130" width="200" height="62" rx="12" fill="#131a26" stroke="#5c6b7f" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="660" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#5c6b7f">layer 2</text>
    <text x="660" y="177" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">never started</text>
    <path d="M240 161 L296 161" stroke="#8b98a9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M500 161 L556 161" stroke="#5c6b7f" stroke-width="1.8" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <text x="40" y="224" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#3fb950">results kept</text>
    <text x="300" y="224" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#f2777a">PipelineRunError raised here</text>
    <text x="560" y="224" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5c6b7f">no 'skipped' status invented</text>
    <rect x="830" y="118" width="330" height="86" rx="12" fill="#131a26" stroke="#f2777a" stroke-width="1.6"/>
    <text x="995" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f2777a">PipelineRunError</text>
    <text x="995" y="177" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">carries the failing step, its error,</text>
    <text x="995" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">and every result collected so far</text>
    <text x="40" y="286" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">The whole layer still finishes first: each step catches its own error and returns a result, so the run only stops</text>
    <text x="40" y="308" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">once every sibling in that layer is done. What never happens is a later layer starting on a broken input.</text>
</svg>
