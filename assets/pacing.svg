    <text x="430" y="524" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#39d3bb">12</text>
    <rect x="470" y="513" width="20" height="9" rx="2" fill="#3fb950"/>
    <text x="1000" y="524" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f0b429">+0.52s</text>
    <text x="60" y="558" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">30s</text>
    <text x="200" y="558" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8b98a9">101</text>
    <rect x="240" y="547" width="172" height="9" rx="2" fill="#f2777a" opacity="0.55"/>
    <text x="430" y="558" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#39d3bb">15</text>
    <rect x="470" y="547" width="26" height="9" rx="2" fill="#3fb950"/>
    <text x="1000" y="558" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f0b429">+0.45s</text>
    <path d="M40 598 L1160 598" stroke="#26324a" stroke-width="1"/>
    <text x="40" y="626" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">The lag column is the cost, not a rounding error: you learn a job finished up to one interval late, bounded by --max-poll-interval.</text>
    <text x="40" y="648" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">Lower the ceiling if a pipeline needs latency more than it needs fewer round trips.</text>
</svg>
