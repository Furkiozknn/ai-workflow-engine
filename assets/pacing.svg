    <text x="480" y="294" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#3fb950">peak 10 - all 40 still run</text>
    <rect x="800" y="146" width="360" height="176" rx="14" fill="#131a26" stroke="#6cb6ff" stroke-width="1.6"/>
    <text x="822" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#6cb6ff">why 10</text>
    <path d="M822 190 L1138 190" stroke="#26324a" stroke-width="1"/>
    <circle cx="830" cy="205" r="3.5" fill="#6cb6ff"/>
    <text x="846" y="210" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">the number ai-job-gateway uses</text>
    <text x="846" y="230" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">for its own webhook fan-out</text>
    <circle cx="830" cy="245" r="3.5" fill="#6cb6ff"/>
    <text x="846" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">inside httpx's 20-connection</text>
    <text x="846" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">keepalive pool, so a wide layer</text>
    <text x="846" y="290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">reuses connections instead of</text>
    <text x="846" y="310" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">opening one per step</text>
    <path d="M40 340 L1160 340" stroke="#26324a" stroke-width="1"/>
    <text x="40" y="368" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c6b7f">HOW OFTEN EACH ONE ASKS</text>
    <text x="40" y="392" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">the interval is flat for the first second, then grows 1.5x per poll to a 5s ceiling</text>
    <text x="60" y="416" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c6b7f">job takes</text>
    <text x="200" y="416" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c6b7f">polls, flat 0.3s</text>
    <text x="430" y="416" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c6b7f">polls, backing off</text>
    <text x="1000" y="416" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c6b7f">detection lag</text>
    <path d="M40 428 L1160 428" stroke="#26324a" stroke-width="1"/>
    <text x="60" y="456" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">3s</text>
    <text x="200" y="456" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8b98a9">11</text>
    <rect x="240" y="445" width="19" height="9" rx="2" fill="#f2777a" opacity="0.55"/>
    <text x="430" y="456" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#39d3bb">8</text>
    <rect x="470" y="445" width="14" height="9" rx="2" fill="#3fb950"/>
    <text x="1000" y="456" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f0b429">+0.34s</text>
    <text x="60" y="490" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">6s</text>
    <text x="200" y="490" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8b98a9">21</text>
    <rect x="240" y="479" width="36" height="9" rx="2" fill="#f2777a" opacity="0.55"/>
    <text x="430" y="490" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#39d3bb">10</text>
