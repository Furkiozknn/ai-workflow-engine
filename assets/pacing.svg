<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 674" width="1200" height="674" role="img" aria-label="Two bounds on what one execution layer costs the gateway. Top: a 40-step layer with no cap puts all 40 jobs in flight at once; with the default max_concurrent_steps of 10 the peak is 10 and all 40 steps still run, that number chosen to match ai-job-gateway's own webhook fan-out and to sit inside httpx's 20-connection keepalive pool. Bottom: poll counts measured at a 0.3 second base interval - a 3 second job goes from 11 polls to 8, 6 seconds from 21 to 10, 15 seconds from 51 to 12, and 30 seconds from 101 to 15 - at the cost of learning a job finished up to one interval late, between 0.34 and 1.13 seconds here and bounded by the 5 second ceiling.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1f24"/>
      <stop offset="100%" stop-color="#0b1a20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d3bb"/>
      <stop offset="50%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b98a9"/>
    </marker>
  </defs>
  <rect width="1200" height="674" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#e6edf3">a layer's width is not its burst size</text>
  <text x="40" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b98a9">both bounds measured against the mock transport in tests/test_runner.py, not estimated</text>
    <text x="40" y="128" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c6b7f">HOW MANY STEPS ARE IN FLIGHT</text>
