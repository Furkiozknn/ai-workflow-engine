# A two-step pipeline that does real work with no API key anywhere:
# generate an image through Pollinations.ai (hosted - the one capability that
# leaves the machine), then upscale it locally with FSRCNN.
#
# Needs an ai-job-gateway started with its `media` extra installed:
#
#   uv sync --extra media && uv run ai-job-gateway serve       # in ai-job-gateway
#   awe run examples/generate-and-upscale.yaml \
#       --gateway-url http://localhost:8000 \
#       --var prompt="a red sneaker on a white background"
#
# The gateway and the toolkit share a filesystem: `output_path` from the
# generate step is a local path the upscale step reads directly.
# For a fully offline dry run swap both capabilities for `mock-generate`.
name: generate-and-upscale
steps:
  - name: generate
    capability: generate-image
    params:
      prompt: "{{ vars.prompt }}"
      width: 768
      height: 512
      seed: 42

  - name: upscale
    capability: media-upscale
    params:
      image_path: "{{ steps.generate.result.output_path }}"
      scale: 2
    depends_on: [generate]
