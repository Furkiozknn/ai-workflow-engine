# A minimal two-step pipeline: generate an image, then "upscale" it.
# Run against a real ai-job-gateway server's mock-generate capability (see
# that repo's README) with:
#
#   awe run examples/generate-and-upscale.yaml \
#       --gateway-url http://localhost:8000 \
#       --var prompt="a red sneaker on a white background"
#
# mock-generate's result doesn't have an image_url field, so this example
# uses mock-generate for both steps to stay runnable against ai-job-gateway's
# own bundled capabilities with no real model provider configured - swap
# `capability` for real capabilities (e.g. image-generate / image-upscale)
# once real providers are wired up.
name: generate-and-upscale
steps:
  - name: generate
    capability: mock-generate
    params:
      prompt: "{{ vars.prompt }}"
      seed: 42

  - name: upscale
    capability: mock-generate
    params:
      source: "{{ steps.generate.result.output }}"
      scale: 2
    depends_on: [generate]
